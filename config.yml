# Humanet Configuration File
# This file contains all metadata for your idea on the Humanet platform
# Learn more: https://docs.humanet.dev

humanet:
  # Version of the Humanet specification
  version: "1.0"
  
  # ==========================================
  # METADATA
  # ==========================================
  
  # Unique identifier (auto-generated by platform, leave empty for new ideas)
  id: ""
  
  # Name of your idea (concise, descriptive)
  name: "Your Idea Name Here"
  
  # One-line description (appears in search results)
  tagline: "A brief description of what this idea solves or achieves"
  
  # Detailed description (optional, keep it under 500 characters)
  description: |
    A more detailed explanation of your idea. This can span multiple lines
    and will be used on the idea's landing page on the Humanet platform.
  
  # ISO 8601 date format (YYYY-MM-DD)
  created: "2026-02-15"
  
  # Last updated timestamp (auto-updated by bot)
  updated: "2026-02-15"
  
  # ==========================================
  # LIFECYCLE MANAGEMENT
  # ==========================================
  
  # Current lifecycle status
  # Options: provisional | validated | active | dormant | archived | deprecated
  status: "provisional"
  
  # Status history (auto-maintained by bot)
  status_history:
    - status: "provisional"
      date: "2026-02-15"
      note: "Initial idea submission"
  
  # Provisional deadline (30 days from creation for validation)
  provisional_deadline: "2026-03-17"
  
  # ==========================================
  # DOMAINS & CLASSIFICATION
  # ==========================================
  
  # Primary domains (used for matching with contributors)
  # Choose 2-5 relevant domains from the list below
  domains:
    - research-tools
    - ai-ml
    - knowledge-management
  
  # Available domains:
  # - ai-ml
  # - blockchain
  # - climate-tech
  # - dev-tools
  # - education
  # - finance
  # - healthcare
  # - knowledge-management
  # - productivity
  # - research-tools
  # - social-impact
  # - web3
  # - other
  
  # Tags (free-form, for additional categorization)
  tags:
    - automation
    - research
    - collaboration
  
  # ==========================================
  # CONTRIBUTORS
  # ==========================================
  
  # Primary maintainers (decision-makers)
  maintainers:
    - username: "yourusername"
      role: "creator"
      joined: "2026-02-15"
      karma: 0
  
  # Active contributors (code, docs, design, etc.)
  contributors: []
    # Example:
    # - username: "contributor1"
    #   role: "developer"
    #   joined: "2026-02-20"
    #   karma: 150
  
  # ==========================================
  # EVOLUTION & FAMILY TREE
  # ==========================================
  
  # Parent idea (if this is a fork or derivative)
  parent: null
    # Example: "parent-idea-id-12345"
  
  # Known forks of this idea
  forks: []
    # Auto-populated by platform
  
  # Active branches (experimental variations)
  branches: []
    # Example:
    # - name: "machine-learning-variant"
    #   url: "https://github.com/user/repo-ml"
    #   created: "2026-03-01"
  
  # Related ideas (manual connections)
  related:
    - id: ""
      relationship: "complements"  # complements | depends-on | inspired-by | supersedes
      note: ""
  
  # ==========================================
  # AI VALIDATION
  # ==========================================
  
  # Last evaluation timestamp
  last_evaluated: null
  
  # AI evaluation score (0-10)
  evaluation_score: null
  
  # Validation status
  validation_status: "pending"  # pending | passed | needs-refinement | failed
  
  # Evaluation criteria scores (auto-generated)
  evaluation_criteria:
    clarity: null          # Is the problem and solution clear?
    feasibility: null      # Is this achievable?
    impact: null           # What's the potential impact?
    originality: null      # Is this novel or derivative?
    completeness: null     # Is documentation complete?
  
  # AI feedback (auto-generated)
  ai_feedback: null
  
  # ==========================================
  # LINKS & RESOURCES
  # ==========================================
  
  # Platform URL (auto-generated)
  platform_url: null
  
  # Repository URL
  repository_url: "https://github.com/yourusername/your-repo"
  
  # External links
  links:
    website: ""
    documentation: ""
    demo: ""
    prototype: ""
    discussion: ""
  
  # ==========================================
  # PROJECT SETTINGS
  # ==========================================
  
  # License for the idea documentation
  # Options: CC-BY-4.0 | CC-BY-SA-4.0 | MIT | Unlicense
  license: "CC-BY-4.0"
  
  # Is this idea accepting contributions?
  accepting_contributions: true
  
  # Contribution guidelines URL
  contribution_guidelines: ""
  
  # Contact information
  contact:
    email: ""
    discord: ""
    twitter: ""
  
  # ==========================================
  # METRICS (AUTO-MAINTAINED BY BOT)
  # ==========================================
  
  metrics:
    # Activity tracking
    last_commit: null
    commit_count: 0
    
    # Engagement
    views: 0
    stars: 0
    forks: 0
    
    # Community
    contributors_count: 1
    discussions_count: 0
    
    # Karma distribution
    total_karma_distributed: 0
